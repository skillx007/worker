
name: MaxSkills Next Prod Deploy

"on":
  repository_dispatch:
    types: [maxskills-next-prod-deploy]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # JOB 1: BUILD AND PUSH NEXT.JS IMAGE
  # ==========================================
  build-push:
    name: Build image & push to GHCR
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}
      base: ${{ steps.meta.outputs.base }}
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout Next.js repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository || 'skillx007/skillx-next' }}
          ref: ${{ github.event.client_payload.ref || 'main' }}
          token: ${{ secrets.NEXT_SKILLX_PRIVATE_REPO_PAT }}

      - name: Verify checkout
        shell: bash
        run: |
          echo "Repository checkout:"
          pwd
          ls -la

          if [ ! -f Dockerfile ]; then
            echo "::error::Dockerfile not found in repository root"
            exit 1
          fi

          echo "Dockerfile found."

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          SHA="$(git rev-parse --short=12 HEAD)"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"

          BASE="ghcr.io/${OWNER_LC}/skillx-next"
          IMAGE="${BASE}:${SHA}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          echo "Building: ${IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.base }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # JOB 2: DEPLOY TO DIGITALOCEAN
  # ==========================================
  deploy:
    name: Deploy Next.js on Droplet
    needs: build-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ----------------------------------------
      # Load production secrets from Infisical
      # ----------------------------------------
      - name: Load secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.SKILLX_INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /backend
          export-type: env

      # ----------------------------------------
      # Prepare SSH key
      # ----------------------------------------
      - name: Prepare SSH key
        id: ssh
        shell: bash
        run: |
          : "${DROPLET_HOST:?missing DROPLET_HOST}"
          : "${DROPLET_USER:?missing DROPLET_USER}"
          : "${DROPLET_SSH_KEY:?missing DROPLET_SSH_KEY}"
          : "${DROPLET_APP_DIR_NEXT:?missing DROPLET_APP_DIR_NEXT}"

          key_path="$RUNNER_TEMP/skillx_next_deploy_key"

          printf '%b\n' "$DROPLET_SSH_KEY" > "$key_path"
          chmod 600 "$key_path"

          if ! grep -q 'BEGIN .*PRIVATE KEY' "$key_path"; then
            echo "::error::Invalid private SSH key"
            exit 1
          fi

          {
            echo "host=$DROPLET_HOST"
            echo "username=$DROPLET_USER"
            echo "key_path=$key_path"
          } >> "$GITHUB_OUTPUT"

      # ----------------------------------------
      # Deploy on DigitalOcean
      # ----------------------------------------
      - name: SSH deploy Next.js
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
          IMAGE_BASE: ${{ needs.build-push.outputs.base }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PAT: ${{ env.GHCR_PAT }}
          DROPLET_APP_DIR_NEXT: ${{ env.DROPLET_APP_DIR_NEXT }}

        with:
          host: ${{ steps.ssh.outputs.host }}
          username: ${{ steps.ssh.outputs.username }}
          key_path: ${{ steps.ssh.outputs.key_path }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          envs: IMAGE,IMAGE_BASE,GHCR_USERNAME,GHCR_PAT,DROPLET_APP_DIR_NEXT

          script: |
            set -euo pipefail

            echo "=================================="
            echo "Starting Next.js production deploy"
            echo "=================================="

            # 1. Validate deployment directory
            : "${DROPLET_APP_DIR_NEXT:?missing app directory}"

            cd "$DROPLET_APP_DIR_NEXT"

            if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              echo "::error::Not a Git repository"
              exit 1
            fi

            # 2. Update deployment configuration
            echo "Updating repository..."

            git fetch --prune origin
            git pull --ff-only

            test -f docker-compose.yml || test -f compose.yml

            # 3. Validate Compose service
            if ! docker compose config --services | grep -qx web; then
              echo "::error::Compose service 'web' not found"
              docker compose config --services
              exit 1
            fi

            # 4. Load Infisical machine credentials
            if ! test -r /etc/infisical.env; then
              echo "::error::Cannot read /etc/infisical.env"
              exit 1
            fi

            set -a
            . /etc/infisical.env
            set +a

            : "${INFISICAL_CLIENT_ID:?missing client ID}"
            : "${INFISICAL_CLIENT_SECRET:?missing client secret}"
            : "${INFISICAL_PROJECT_ID:?missing project ID}"

            # 5. Authenticate with Infisical
            export INFISICAL_DISABLE_UPDATE_CHECK=true

            export INFISICAL_TOKEN="$(
              infisical login \
                --method=universal-auth \
                --client-id="$INFISICAL_CLIENT_ID" \
                --client-secret="$INFISICAL_CLIENT_SECRET" \
                --plain \
                --silent
            )"

            # 6. Fetch production environment variables
            echo "Fetching production environment..."

            infisical export \
              --silent \
              --token="$INFISICAL_TOKEN" \
              --projectId="$INFISICAL_PROJECT_ID" \
              --env=prod \
              --path=/backend \
              --format=dotenv > .env.tmp

            mv .env.tmp .env
            chmod 600 .env

            # 7. Validate GHCR credentials
            : "${GHCR_PAT:?missing GHCR_PAT}"
            : "${GHCR_USERNAME:?missing GHCR_USERNAME}"
            : "${IMAGE:?missing Docker image}"

            # 8. Login to GitHub Container Registry
            echo "$GHCR_PAT" | docker login ghcr.io \
              -u "$GHCR_USERNAME" \
              --password-stdin

            # 9. Save currently running image for rollback
            SERVICE="web"

            PREV_IMAGE="$(
              docker compose ps --format '{{.Image}}' "$SERVICE" \
                2>/dev/null | head -n1 || true
            )"

            echo "Previous image: ${PREV_IMAGE:-none}"
            echo "New image: $IMAGE"

            # 10. Pull new image
            export IMAGE

            echo "Pulling new image..."

            docker compose pull "$SERVICE"

            # 11. Deploy Next.js
            echo "Starting Next.js container..."

            if ! docker compose up -d --no-deps "$SERVICE"; then
              echo "::error::Deployment command failed"

              if [ -n "$PREV_IMAGE" ]; then
                echo "Rolling back to previous image..."

                IMAGE="$PREV_IMAGE" \
                  docker compose up -d --no-deps "$SERVICE" || true
              fi

              exit 1
            fi

            # 12. Healthcheck
            echo "Waiting for application health..."

            health_status="starting"

            for i in $(seq 1 45); do

              CONTAINER_ID="$(docker compose ps -q "$SERVICE")"

              if [ -z "$CONTAINER_ID" ]; then
                health_status="missing"
              else
                health_status="$(
                  docker inspect \
                    --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                    "$CONTAINER_ID" 2>/dev/null || echo starting
                )"
              fi

              echo "Health check [$i/45]: $health_status"

              [ "$health_status" = "healthy" ] && break
              [ "$health_status" = "unhealthy" ] && break

              sleep 2
            done

            # 13. Rollback if unhealthy
            if [ "$health_status" != "healthy" ]; then

              echo "::error::Next.js healthcheck failed"

              if [ -n "$PREV_IMAGE" ]; then
                echo "Rolling back to $PREV_IMAGE"

                IMAGE="$PREV_IMAGE" \
                  docker compose up -d --no-deps "$SERVICE"
              else
                echo "No previous image available for rollback"
              fi

              exit 1
            fi

            # 14. Cleanup unused images
            docker image prune -f

            echo "=================================="
            echo "NEXT.JS DEPLOYMENT SUCCESSFUL"
            echo "=================================="

  # ==========================================
  # JOB 3: COMMENT DEPLOYMENT STATUS ON PR
  # ==========================================
  notify-pr:
    name: Comment deployment status on PR
    needs: deploy

    if: |
      always() &&
      github.event.client_payload.pr_number != null

    runs-on: ubuntu-latest

    env:
      PRIVATE_REPO: ${{ github.event.client_payload.repository }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}

    steps:
      - name: Comment deployment status on PR
        env:
          GH_PAT: ${{ secrets.NEXT_SKILLX_PRIVATE_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ needs.deploy.result }}" = "success" ]; then
            MESSAGE="✅ Production deployment succeeded"
          else
            MESSAGE="❌ Production deployment failed"
          fi

          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${PRIVATE_REPO}/issues/${PR_NUMBER}/comments" \
            -d "$(jq -cn --arg body "$MESSAGE" '{body:$body}')"
